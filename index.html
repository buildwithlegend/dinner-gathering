<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>門扇與屏風尺寸計算器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f8fafc; color: #1e293b; }
    </style>
</head>
<body class="min-h-screen py-8 px-4 sm:px-6">
    <div class="max-w-xl mx-auto bg-white rounded-2xl shadow-xl p-6 sm:p-8 border border-slate-100">
        
        <!-- 標題與操作按鈕 -->
        <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-100">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">門扇與屏風尺寸計算器</h1>
                <p class="text-xs text-slate-500 mt-0.5">專業五金與尺寸自動化推算工具</p>
            </div>
            <div class="flex gap-2">
                <button onclick="resetForm()" class="px-3.5 py-2 text-xs font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors">重設</button>
                <button onclick="copyResults()" class="px-3.5 py-2 text-xs font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-sm transition-colors">複製結果</button>
            </div>
        </div>

        <!-- 參數輸入區 -->
        <div class="space-y-4">
            <h2 class="text-sm font-semibold text-slate-700 uppercase tracking-wider">1. 輸入尺寸與五金參數</h2>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">見光寬 (A6)</label>
                    <div class="relative">
                        <input type="number" id="a6" value="2543" oninput="calculate()" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 font-medium focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all">
                        <span class="absolute right-3.5 top-2.5 text-xs text-slate-400">mm</span>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">總高度 (A4)</label>
                    <div class="relative">
                        <input type="number" id="a4" value="2400" oninput="calculate()" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 font-medium focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all">
                        <span class="absolute right-3.5 top-2.5 text-xs text-slate-400">mm</span>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">門扇數量 (B2)</label>
                    <input type="number" id="b2" value="3" min="1" oninput="calculate()" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 font-medium focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">門扇加尺 (B6)</label>
                    <div class="relative">
                        <input type="number" id="b6" value="0" oninput="calculate()" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 font-medium focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all">
                        <span class="absolute right-3.5 top-2.5 text-xs text-slate-400">mm</span>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">門體類型 (B3)</label>
                    <select id="b3" onchange="calculate()" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 font-medium focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all">
                        <option value="一號門體">一號門體</option>
                        <option value="二號門體">二號門體</option>
                        <option value="一般門體">一般門體</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">屏風寬計算 (B5)</label>
                    <select id="b5" onchange="calculate()" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 font-medium focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all">
                        <option value="計算屏風寬">計算屏風寬</option>
                        <option value="不計算">不計算</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">軌道狀態 (A3)</label>
                    <select id="a3" onchange="calculate()" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 font-medium focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all">
                        <option value="含軌道高">含軌道高</option>
                        <option value="不含軌道高">不含軌道高</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">連動方式 (C7)</label>
                    <select id="c7" onchange="calculate()" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 font-medium focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all">
                        <option value="同步連動">同步連動</option>
                        <option value="不連動">不連動</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 計算結果區 -->
        <div class="mt-8 space-y-4">
            <h2 class="text-sm font-semibold text-slate-700 uppercase tracking-wider">2. 試算輸出結果</h2>
            
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div class="bg-blue-50 border border-blue-100 rounded-xl p-4 text-center">
                    <span class="block text-xs font-medium text-blue-600 mb-1">單片門扇寬 (A8)</span>
                    <span id="res-a8" class="text-2xl font-bold text-blue-900">0</span>
                    <span class="text-xs text-blue-500 ml-0.5">mm</span>
                </div>
                <div class="bg-emerald-50 border border-emerald-100 rounded-xl p-4 text-center">
                    <span class="block text-xs font-medium text-emerald-600 mb-1">屏風寬 (A12)</span>
                    <span id="res-a12" class="text-2xl font-bold text-emerald-900">0</span>
                    <span class="text-xs text-emerald-500 ml-0.5">mm</span>
                </div>
                <div class="bg-violet-50 border border-violet-100 rounded-xl p-4 text-center">
                    <span class="block text-xs font-medium text-violet-600 mb-1">門扇高度 (A10)</span>
                    <span id="res-a10" class="text-2xl font-bold text-violet-900">0</span>
                    <span class="text-xs text-violet-500 ml-0.5">mm</span>
                </div>
            </div>
        </div>

        <!-- 計算明細 -->
        <div class="mt-6 bg-slate-50 border border-slate-200 rounded-xl p-4">
            <h3 class="text-xs font-semibold text-slate-700 mb-2 uppercase tracking-wider">計算明細與防呆提示</h3>
            <div id="details" class="text-xs text-slate-600 space-y-1 font-mono"></div>
        </div>
    </div>

    <script>
        function calculate() {
            const A6 = parseFloat(document.getElementById('a6').value) || 0;
            const A4 = parseFloat(document.getElementById('a4').value) || 0;
            const B2 = parseInt(document.getElementById('b2').value) || 1;
            const B6 = parseFloat(document.getElementById('b6').value) || 0;
            const B3 = document.getElementById('b3').value;
            const B5 = document.getElementById('b5').value;
            const A3 = document.getElementById('a3').value;
            const C7 = document.getElementById('c7').value;

            // A12 屏風寬公式
            let a12 = 0;
            if (B5 === "計算屏風寬") {
                let term1 = A6;
                let term2 = B2 <= 2 ? B2 * 1.5 : B2 * 2.5;
                let term3 = B3 === "一號門體" ? B2 * 16 : (B3 === "二號門體" ? B2 * 10 : 0);
                a12 = Math.ceil((term1 + term2 + term3) / B2);
            }

            // A8 單片門扇寬公式（加入 B6 門扇加尺）
            let a8 = 0;
            let a8Detail = "";
            if (B5 === "計算屏風寬") {
                if (B2 <= 1) {
                    a8 = "錯誤：計算屏風時門扇數需大於1";
                    a8Detail = "門扇數量不足，無法分攤屏風寬";
                } else {
                    let rawA8 = (A6 - a12 + B6) / (B2 - 1);
                    a8 = Math.ceil(rawA8);
                    a8Detail = `(見光寬 ${A6} - 屏風寬 ${a12} + 加尺 ${B6}) / (${B2} - 1扇) = 向上取整`;
                }
            } else {
                let rawA8 = (A6 + B6) / B2;
                a8 = Math.ceil(rawA8);
                a8Detail = `(見光寬 ${A6} + 加尺 ${B6}) / ${B2}扇 = 向上取整`;
            }

            // A10 門扇高度公式
            let subTrack = A3 === "含軌道高" ? 47 : 0;
            let subLink = C7 === "同步連動" ? 12 : 8;
            let a10 = A4 - subTrack - subLink;
            let a10Detail = A3 === "含軌道高" ? `${A4} - 47(軌道) - ${subLink}(${C7})` : `${A4} - ${subLink}(${C7})`;

            // 畫面渲染
            document.getElementById('res-a8').innerText = typeof a8 === 'number' ? a8 : 'Error';
            document.getElementById('res-a12').innerText = a12;
            document.getElementById('res-a10').innerText = a10;

            document.getElementById('details').innerHTML = `
                <div>• <strong>A12 屏風寬</strong>: ${a12} mm</div>
                <div>• <strong>A8 單片門扇寬</strong>: ${a8} mm <span class="text-slate-400 text-[10px]">(${a8Detail})</span></div>
                <div>• <strong>A10 門扇高度</strong>: ${a10} mm <span class="text-slate-400 text-[10px]">(${a10Detail})</span></div>
            `;
        }

        function resetForm() {
            document.getElementById('a6').value = 2543;
            document.getElementById('a4').value = 2400;
            document.getElementById('b2').value = 3;
            document.getElementById('b6').value = 0;
            document.getElementById('b3').value = "一號門體";
            document.getElementById('b5').value = "計算屏風寬";
            document.getElementById('a3').value = "含軌道高";
            document.getElementById('c7').value = "同步連動";
            calculate();
        }

        function copyResults() {
            const a8 = document.getElementById('res-a8').innerText;
            const a12 = document.getElementById('res-a12').innerText;
            const a10 = document.getElementById('res-a10').innerText;
            const b6 = document.getElementById('b6').value;
            const text = `【尺寸計算結果】\n• 門扇加尺 (B6): ${b6} mm\n• 單片門扇寬 (A8): ${a8} mm\n• 屏風寬 (A12): ${a12} mm\n• 門扇高度 (A10): ${a10} mm`;
            
            navigator.clipboard.writeText(text).then(() => {
                alert('已成功複製規格結果！');
            });
        }

        // 初始化計算
        calculate();
    </script>
</body>
</html>
