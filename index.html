<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自動排班系統 (週休二日 + 精準160h)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1, h2, h3 { color: #333; }
        .control-panel {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        input[type="text"], input[type="month"] {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 9px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
        }
        button:hover { background-color: #0056b3; }
        .table-wrapper { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 14px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px 6px;
            text-align: center;
        }
        th { background-color: #e9ecef; position: sticky; top: 0; }
        .off { background-color: #ffe6e6; color: #d9534f; font-weight: bold; }
        .sunday { background-color: #f8d7da; color: #721c24; font-weight: bold; }
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }
        .summary-card {
            background: #e9ecef;
            padding: 10px 15px;
            border-radius: 6px;
            text-align: center;
        }
        .pass { color: #28a745; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>08:00 - 21:00 自動排班系統 (平日排休 + 精準160h)</h1>
    
    <div class="control-panel">
        <div class="form-group">
            <label for="monthPicker">選擇月份：</label>
            <input type="month" id="monthPicker">
        </div>
        
        <div class="form-group" style="flex-grow: 1;">
            <label for="employeeInput">員工姓名（剛好 6 位）：</label>
            <input type="text" id="employeeInput" value="員工A, 員工B, 員工C, 員工D, 員工E, 員工F">
        </div>

        <button onclick="generateMonthlySchedule()">重新產生班表</button>
    </div>

    <div id="result"></div>
</div>

<script>
document.getElementById('monthPicker').value = new Date().toISOString().slice(0, 7);

function generateMonthlySchedule() {
    const monthVal = document.getElementById('monthPicker').value;
    if (!monthVal) { alert("請選擇月份！"); return; }

    const inputVal = document.getElementById('employeeInput').value;
    let employees = inputVal.split(/[,，\s]+/).filter(e => e.trim() !== '');

    if (employees.length !== 6) {
        alert("請輸入剛好 6 位員工姓名！");
        return;
    }

    const [year, month] = monthVal.split('-').map(Number);
    const totalDays = new Date(year, month, 0).getDate();
    const dayNames = ['日', '一', '二', '三', '四', '五', '六'];
    
    // 各班別時數配置：早班 4h, 中班 5h, 晚班 4h
    const shiftHours = { morning: 4, noon: 5, night: 4 };

    // 初始化統計數據（目標每人剛好 160 小時）
    let stats = {};
    employees.forEach(emp => { 
        stats[emp] = { hours: 0, shiftsCount: 0, daysCount: 0, weekdayOffs: 0 }; 
    });

    let monthlySchedule = [];
    let currentWeekWorkedDays = {};
    employees.forEach(emp => currentWeekWorkedDays[emp] = 0);

    for (let d = 1; d <= totalDays; d++) {
        let dateObj = new Date(year, month - 1, d);
        let dayOfWeek = dateObj.getDay();
        let isSunday = dayOfWeek === 0;
        let isSaturday = dayOfWeek === 6;

        // 週一重置當週工作天數統計
        if (dayOfWeek === 1) {
            employees.forEach(emp => currentWeekWorkedDays[emp] = 0);
        }

        if (isSunday) {
            monthlySchedule.push({
                date: d, dayName: dayNames[dayOfWeek], isSunday: true,
                morning: '-', noon: '-', night: '-', off: employees.join(', ')
            });
        } else {
            // 平日：早班 (2~3人)、中班 (2人)、晚班 (2~3人)
            // 週六：早班 (3人)、中班 (2~3人)
            let shiftRequirements = isSaturday 
                ? [ { name: 'morning', count: 3 }, { name: 'noon', count: 2 } ]
                : [ { name: 'morning', count: 2 }, { name: 'noon', count: 2 }, { name: 'night', count: 2 } ];

            let assigned = { morning: [], noon: [], night: [] };
            let todayWorkingSet = new Set();

            shiftRequirements.forEach(shift => {
                let h = shiftHours[shift.name];

                // 篩選條件：
                // 1. 加上本次班別工時未超過 160h
                // 2. 避免單日連續排班超過上限（優先選擇未排班者）
                let available = employees.filter(emp => 
                    stats[emp].hours + h <= 160 && !assigned[shift.name].includes(emp)
                );

                // 排序權重：
                // 1. 本週已工作天數較少者優先（強制平日至少排休1天）
                // 2. 總累積工時較少者優先
                available.sort((a, b) => {
                    if (currentWeekWorkedDays[a] !== currentWeekWorkedDays[b]) {
                        return currentWeekWorkedDays[a] - currentWeekWorkedDays[b];
                    }
                    return (stats[a].hours - stats[b].hours) || (Math.random() - 0.5);
                });

                // 若符合條件者不足，則調用備用人員
                if (available.length < shift.count) {
                    let overflow = employees.filter(emp => !available.includes(emp))
                                           .sort((a, b) => stats[a].hours - stats[b].hours);
                    available = available.concat(overflow);
                }

                let selected = available.slice(0, shift.count);
                assigned[shift.name] = selected;

                selected.forEach(emp => {
                    stats[emp].hours += h;
                    stats[emp].shiftsCount++;
                    todayWorkingSet.add(emp);
                });
            });

            // 記錄當日出勤與排休狀態
            todayWorkingSet.forEach(emp => {
                stats[emp].daysCount++;
                currentWeekWorkedDays[emp]++;
            });

            let offEmps = employees.filter(e => !todayWorkingSet.has(e));
            offEmps.forEach(emp => stats[emp].weekdayOffs++);

            monthlySchedule.push({
                date: d,
                dayName: dayNames[dayOfWeek],
                isSunday: false,
                morning: assigned.morning.length > 0 ? assigned.morning.join(', ') : '-',
                noon: assigned.noon.length > 0 ? assigned.noon.join(', ') : '-',
                night: isSaturday ? '-' : (assigned.night.length > 0 ? assigned.night.join(', ') : '-'),
                off: offEmps.join(', ')
            });
        }
    }

    renderMonthlyTable(monthVal, monthlySchedule, stats, employees);
}

function renderMonthlyTable(monthVal, schedule, stats, employees) {
    let html = `<h2>${monthVal} 月度班表總覽 (包含平日排休機制)</h2>`;

    html += `<div class="table-wrapper"><table>
        <tr>
            <th>日期</th>
            <th>星期</th>
            <th>早班 (08:00-12:00 / 4h)</th>
            <th>中班 (12:00-17:00 / 5h)</th>
            <th>晚班 (17:00-21:00 / 4h)</th>
            <th>當日排休人員</th>
        </tr>`;

    schedule.forEach(s => {
        if (s.isSunday) {
            html += `<tr class="sunday">
                <td>${s.date} 日</td>
                <td>週${s.dayName}</td>
                <td colspan="4">全店公休 (例假日)</td>
            </tr>`;
        } else {
            html += `<tr>
                <td><strong>${s.date} 日</strong></td>
                <td>週${s.dayName}</td>
                <td>${s.morning}</td>
                <td>${s.noon}</td>
                <td>${s.night}</td>
                <td class="off">${s.off}</td>
            </tr>`;
        }
    });

    html += `</table></div>`;

    html += `<h3>【個人工時與休假統計】(目標：每人剛好 160h + 每週平日至少休1天)</h3>`;
    html += `<div class="summary-grid">`;
    
    employees.forEach(emp => {
        let h = stats[emp].hours;
        html += `<div class="summary-card">
            <strong>${emp}</strong><br>
            總工時：<span class="pass">${h} 小時</span><br>
            出勤天數：${stats[emp].daysCount} 天<br>
            平日排休：${stats[emp].weekdayOffs} 天
        </div>`;
    });
    
    html += `</div>`;

    document.getElementById('result').innerHTML = html;
}

window.onload = generateMonthlySchedule;
</script>

</body>
</html>
