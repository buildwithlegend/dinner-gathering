<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>月度自動排班系統</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1, h2, h3 {
            color: #333;
        }
        .control-panel {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        input[type="text"], input[type="month"] {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 9px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .table-wrapper {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 14px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px 6px;
            text-align: center;
        }
        th {
            background-color: #e9ecef;
            position: sticky;
            top: 0;
        }
        .off {
            background-color: #ffe6e6;
            color: #d9534f;
            font-weight: bold;
        }
        .sunday {
            background-color: #f8d7da;
            color: #721c24;
            font-weight: bold;
        }
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }
        .summary-card {
            background: #e9ecef;
            padding: 10px 15px;
            border-radius: 6px;
        }
        .warning {
            color: #c82333;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>月度自動排班系統</h1>
    
    <div class="control-panel">
        <div class="form-group">
            <label for="monthPicker">選擇月份：</label>
            <input type="month" id="monthPicker">
        </div>
        
        <div class="form-group" style="flex-grow: 1;">
            <label for="employeeInput">員工姓名（逗號或空格分隔）：</label>
            <input type="text" id="employeeInput" value="員工A, 員工B, 員工C, 員工D, 員工E, 員工F">
        </div>

        <button onclick="generateMonthlySchedule()">重新產生月班表</button>
    </div>

    <div id="result"></div>
</div>

<script>
// 設定預設月份為當月
document.getElementById('monthPicker').value = new Date().toISOString().slice(0, 7);

function generateMonthlySchedule() {
    const monthVal = document.getElementById('monthPicker').value;
    if (!monthVal) {
        alert("請選擇月份！");
        return;
    }

    const inputVal = document.getElementById('employeeInput').value;
    let employees = inputVal.split(/[,，\s]+/).filter(e => e.trim() !== '');

    if (employees.length < 5) {
        alert("人力不足！每天需要 3 人上班，考慮輪休與工時，建議至少需要 5~6 位員工。");
        return;
    }

    const [year, month] = monthVal.split('-').map(Number);
    const totalDays = new Date(year, month, 0).getDate(); // 當月天數
    
    const dayNames = ['日', '一', '二', '三', '四', '五', '六'];
    let monthDates = [];
    
    for (let d = 1; d <= totalDays; d++) {
        let dateObj = new Date(year, month - 1, d);
        let dayOfWeek = dateObj.getDay();
        monthDates.push({
            date: d,
            dayOfWeek: dayOfWeek,
            dayName: dayNames[dayOfWeek],
            isSunday: dayOfWeek === 0,
            isSaturday: dayOfWeek === 6
        });
    }

    // 初始化員工工時統計與排班資料
    let stats = {};
    employees.forEach(emp => {
        stats[emp] = { hours: 0, offCount: 0, daysCount: 0 };
    });

    let monthlySchedule = [];

    // 開始逐日排班
    monthDates.forEach(d => {
        if (d.isSunday) {
            // 週日全員公休（例假）
            monthlySchedule.push({
                date: d.date,
                dayName: d.dayName,
                isSunday: true,
                morning: '-',
                noon: '-',
                night: '-',
                off: employees.join(', ')
            });
            employees.forEach(emp => stats[emp].offCount++);
        } else {
            // 決定今日所需班別
            let requiredShifts = d.isSaturday ? ['早班', '中班'] : ['早班', '中班', '晚班'];
            
            // 按目前累計工時升序排序員工（讓工時較少的人優先排班）
            let sortedEmployees = [...employees].sort((a, b) => {
                return stats[a].hours - stats[b].hours || Math.random() - 0.5;
            });

            // 挑選今天上班的人（平日 3 人，週六 2 人，其餘排休）
            let working = sortedEmployees.slice(0, requiredShifts.length);
            let off = sortedEmployees.slice(requiredShifts.length);

            // 隨機打亂上班人員的班別分配
            working.sort(() => Math.random() - 0.5);

            let dayShift = {
                date: d.date,
                dayName: d.dayName,
                isSunday: false,
                isSaturday: d.isSaturday,
                morning: working[0],
                noon: working[1],
                night: d.isSaturday ? '-' : working[2],
                off: off.join(', ')
            };

            // 更新工時統計（假設每班別為 8 小時）
            working.forEach(emp => {
                stats[emp].hours += 8;
                stats[emp].daysCount++;
            });
            off.forEach(emp => {
                stats[emp].offCount++;
            });

            monthlySchedule.push(dayShift);
        }
    });

    renderMonthlyTable(monthVal, monthDates, monthlySchedule, stats);
}

function renderMonthlyTable(monthVal, monthDates, schedule, stats) {
    let html = `<h2>${monthVal} 月度班表總覽</h2>`;

    // 1. 班表主要表格
    html += `<div class="table-wrapper"><table>
        <tr>
            <th>日期</th>
            <th>星期</th>
            <th>早班 (8h)</th>
            <th>中班 (8h)</th>
            <th>晚班 (8h)</th>
            <th>排休成員</th>
        </tr>`;

    schedule.forEach(s => {
        if (s.isSunday) {
            html += `<tr class="sunday">
                <td>${s.date} 日</td>
                <td>週${s.dayName}</td>
                <td colspan="4">全店公休 (例假日)</td>
            </tr>`;
        } else {
            html += `<tr>
                <td><strong>${s.date} 日</strong></td>
                <td>週${s.dayName}</td>
                <td>${s.morning}</td>
                <td>${s.noon}</td>
                <td>${s.night}</td>
                <td class="off">${s.off}</td>
            </tr>`;
        }
    });

    html += `</table></div>`;

    // 2. 個人月度總工時與休假統計
    html += `<h3>【個人總工時統計】(目標：≥ 160 小時)</h3>`;
    html += `<div class="summary-grid">`;
    
    Object.keys(stats).forEach(emp => {
        let h = stats[emp].hours;
        let pass = h >= 160;
        html += `<div class="summary-card">
            <strong>${emp}</strong><br>
            總工時：<span class="${pass ? '' : 'warning'}">${h} 小時</span> ${pass ? '✔' : '(未達標)'}<br>
            出勤天數：${stats[emp].daysCount} 天<br>
            排休天數：${stats[emp].offCount} 天
        </div>`;
    });
    
    html += `</div>`;

    document.getElementById('result').innerHTML = html;
}

// 頁面初始化自動執行
window.onload = generateMonthlySchedule;
</script>

</body>
</html>
