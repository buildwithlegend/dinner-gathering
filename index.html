<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>逐日自訂班別與排休系統 (含當日個人工時顯示)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1250px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1, h2, h3 { color: #333; }
        .control-panel {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            border: 1px solid #e9ecef;
        }
        .form-row {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        input[type="text"], input[type="month"] {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .num-input {
            width: 50px;
            padding: 4px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 9px 18px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }
        button:hover { background-color: #0056b3; }
        .btn-sec {
            background-color: #6c757d;
            padding: 6px 12px;
            font-size: 13px;
        }
        .btn-sec:hover { background-color: #5a6268; }
        
        /* 週區塊與表格卡片樣式 */
        .week-card {
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 15px;
            background: #fff;
            overflow: hidden;
        }
        .week-header {
            background-color: #495057;
            color: #fff;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 14px;
        }
        .result-header {
            background-color: #343a40;
        }
        .btn-toggle-week {
            background-color: #17a2b8;
            color: white;
            padding: 4px 10px;
            font-size: 12px;
            border-radius: 3px;
            border: none;
            cursor: pointer;
        }
        .btn-toggle-week:hover { background-color: #138496; }

        .daily-setting-table, table.result-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .daily-setting-table th, .daily-setting-table td,
        table.result-table th, table.result-table td {
            border: 1px solid #ddd;
            padding: 6px;
            text-align: center;
        }
        .daily-setting-table th, table.result-table th { background-color: #e9ecef; }
        .sun-row { background-color: #f8d7da; }
        .table-wrapper { overflow-x: auto; }
        
        .off { background-color: #ffe6e6; color: #d9534f; font-weight: bold; }
        .sunday { background-color: #f8d7da; color: #721c24; font-weight: bold; }
        .work-hours-cell { background-color: #f0f7ff; color: #0056b3; text-align: left !important; padding-left: 10px !important; }
        
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }
        .summary-card {
            background: #e9ecef;
            padding: 10px 15px;
            border-radius: 6px;
            text-align: center;
        }
        .pass { color: #28a745; font-weight: bold; }
        .warn { color: #d9534f; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>08:00 - 21:00 逐日自訂班別與排休系統</h1>
    
    <div class="control-panel">
        <div class="form-row">
            <div class="form-group">
                <label for="monthPicker"><strong>1. 選擇月份：</strong></label>
                <input type="month" id="monthPicker" onchange="renderDailyInputTable()">
            </div>
            
            <div class="form-group" style="flex-grow: 1;">
                <label for="employeeInput"><strong>2. 員工姓名（預設 6 位）：</strong></label>
                <input type="text" id="employeeInput" value="麗菁, 嘉明, 哲嘉, 俊德, 敏琪, 員工F">
            </div>
        </div>

        <hr style="border: 0; border-top: 1px solid #dee2e6; margin: 15px 0;">

        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 10px;">
            <h3>3. 逐日輸入各班別與休假人數：</h3>
            <div>
                <button class="btn-sec" onclick="toggleInputWeeks(true)">全展開設定</button>
                <button class="btn-sec" onclick="toggleInputWeeks(false)">全隱藏設定</button>
                <button class="btn-sec" onclick="applyDefaultValues()" style="background-color: #28a745;">一鍵帶入預設 (早3/中3/晚3/休1)</button>
            </div>
        </div>

        <div id="inputWeeksContainer">
            <!-- 動態產生按週分組的輸入表格 -->
        </div>

        <div style="text-align: right; margin-top: 15px;">
            <button onclick="generateMonthlySchedule()">開始產生班表</button>
        </div>
    </div>

    <div id="result"></div>
</div>

<script>
document.getElementById('monthPicker').value = new Date().toISOString().slice(0, 7);

function renderDailyInputTable() {
    const monthVal = document.getElementById('monthPicker').value;
    if (!monthVal) return;

    const [year, month] = monthVal.split('-').map(Number);
    const totalDays = new Date(year, month, 0).getDate();
    const dayNames = ['日', '一', '二', '三', '四', '五', '六'];

    let container = document.getElementById('inputWeeksContainer');
    container.innerHTML = '';

    let weeks = [];
    let currentWeek = [];

    for (let d = 1; d <= totalDays; d++) {
        let dateObj = new Date(year, month - 1, d);
        let dayOfWeek = dateObj.getDay();

        if (dayOfWeek === 0 && currentWeek.length > 0) {
            weeks.push(currentWeek);
            currentWeek = [];
        }
        currentWeek.push({ day: d, dayOfWeek: dayOfWeek });
        if (d === totalDays) {
            weeks.push(currentWeek);
        }
    }

    weeks.forEach((weekData, wIndex) => {
        let weekNum = wIndex + 1;
        let startDate = weekData[0].day;
        let endDate = weekData[weekData.length - 1].day;

        let weekCard = document.createElement('div');
        weekCard.className = 'week-card';

        let html = `
            <div class="week-header">
                <span>第 ${weekNum} 週 (${month}月${startDate}日 ~ ${month}月${endDate}日)</span>
                <button class="btn-toggle-week" onclick="toggleBlock('input_week_${weekNum}', this)">隱藏當週</button>
            </div>
            <div class="table-wrapper" id="input_week_${weekNum}">
                <table class="daily-setting-table">
                    <thead>
                        <tr>
                            <th style="width: 8%;">日期</th>
                            <th style="width: 8%;">星期</th>
                            <th>早班 (08-12 / 4h)</th>
                            <th>中班 (12-17 / 5h)</th>
                            <th>晚班 (17-21 / 4h)</th>
                            <th style="color:#d9534f;">休假人數</th>
                            <th style="width: 20%;">說明</th>
                        </tr>
                    </thead>
                    <tbody>`;

        weekData.forEach(item => {
            let d = item.day;
            let dayOfWeek = item.dayOfWeek;
            let isSunday = dayOfWeek === 0;

            html += `
                <tr class="${isSunday ? 'sun-row' : ''}">
                    <td><strong>${d} 日</strong></td>
                    <td>週${dayNames[dayOfWeek]}</td>
                    <td><input type="number" id="m_${d}" class="num-input" value="${isSunday ? 0 : 3}" min="0"></td>
                    <td><input type="number" id="n_${d}" class="num-input" value="${isSunday ? 0 : 3}" min="0"></td>
                    <td><input type="number" id="e_${d}" class="num-input" value="${isSunday ? 0 : 3}" min="0"></td>
                    <td><input type="number" id="o_${d}" class="num-input" value="${isSunday ? 6 : 1}" min="0" style="color:#d9534f; font-weight:bold;"></td>
                    <td style="color: #666; font-size: 12px;">${isSunday ? '週日預設全店公休' : '可隨時手動微調'}</td>
                </tr>`;
        });

        html += `</tbody></table></div>`;
        weekCard.innerHTML = html;
        container.appendChild(weekCard);
    });
}

function applyDefaultValues() {
    const monthVal = document.getElementById('monthPicker').value;
    const [year, month] = monthVal.split('-').map(Number);
    const totalDays = new Date(year, month, 0).getDate();

    for (let d = 1; d <= totalDays; d++) {
        let dayOfWeek = new Date(year, month - 1, d).getDay();
        if (dayOfWeek !== 0) {
            document.getElementById(`m_${d}`).value = 3;
            document.getElementById(`n_${d}`).value = 3;
            document.getElementById(`e_${d}`).value = 3;
            document.getElementById(`o_${d}`).value = 1;
        }
    }
}

function generateMonthlySchedule() {
    const monthVal = document.getElementById('monthPicker').value;
    if (!monthVal) { alert("請選擇月份！"); return; }

    const inputVal = document.getElementById('employeeInput').value;
    let employees = inputVal.split(/[,，\s]+/).filter(e => e.trim() !== '');

    if (employees.length === 0) {
        alert("請輸入員工姓名！");
        return;
    }

    const [year, month] = monthVal.split('-').map(Number);
    const totalDays = new Date(year, month, 0).getDate();
    const dayNames = ['日', '一', '二', '三', '四', '五', '六'];
    const shiftHours = { morning: 4, noon: 5, night: 4 };

    let stats = {};
    employees.forEach(emp => { 
        stats[emp] = { hours: 0, shiftsCount: 0, daysCount: 0, weekdayOffs: 0 }; 
    });

    let monthlySchedule = [];

    for (let d = 1; d <= totalDays; d++) {
        let dateObj = new Date(year, month - 1, d);
        let dayOfWeek = dateObj.getDay();

        let mCount = parseInt(document.getElementById(`m_${d}`).value) || 0;
        let nCount = parseInt(document.getElementById(`n_${d}`).value) || 0;
        let eCount = parseInt(document.getElementById(`e_${d}`).value) || 0;
        let oCount = parseInt(document.getElementById(`o_${d}`).value) || 0;

        if (mCount === 0 && nCount === 0 && eCount === 0) {
            monthlySchedule.push({
                date: d, dayName: dayNames[dayOfWeek], dayOfWeek: dayOfWeek, isOffDay: true,
                morning: '-', noon: '-', night: '-', off: employees.join(', '), dailyHoursStr: '-'
            });
        } else {
            let eligibleForOff = employees.filter(emp => stats[emp].weekdayOffs < 4);

            eligibleForOff.sort((a, b) => 
                (stats[a].weekdayOffs - stats[b].weekdayOffs) ||
                (stats[b].hours - stats[a].hours) ||
                (Math.random() - 0.5)
            );

            let actualOffCount = Math.min(oCount, eligibleForOff.length);
            let todayOffSet = new Set(eligibleForOff.slice(0, actualOffCount));
            let availableWorkers = employees.filter(emp => !todayOffSet.has(emp));

            let assigned = { morning: [], noon: [], night: [] };
            let todayWorkingSet = new Set();
            let todayWorkerHours = {}; // 記錄當天個別員工工時

            const shiftsToAssign = [
                { key: 'morning', count: mCount, hours: shiftHours.morning },
                { key: 'noon', count: nCount, hours: shiftHours.noon },
                { key: 'night', count: eCount, hours: shiftHours.night }
            ];

            shiftsToAssign.forEach(shift => {
                let available = availableWorkers.filter(emp => 
                    (stats[emp].hours + shift.hours <= 160) && 
                    !assigned[shift.key].includes(emp)
                );

                available.sort((a, b) => (stats[a].hours - stats[b].hours) || (Math.random() - 0.5));

                let selected = available.slice(0, shift.count);
                assigned[shift.key] = selected;

                selected.forEach(emp => {
                    stats[emp].hours += shift.hours;
                    stats[emp].shiftsCount++;
                    todayWorkingSet.add(emp);

                    // 採計當天個人工時
                    todayWorkerHours[emp] = (todayWorkerHours[emp] || 0) + shift.hours;
                });
            });

            todayWorkingSet.forEach(emp => stats[emp].daysCount++);
            let offEmps = employees.filter(e => !todayWorkingSet.has(e));
            offEmps.forEach(emp => stats[emp].weekdayOffs++);

            // 格式化當日個人工時字串 (例：哲嘉(8h), 敏琪(4h))
            let dailyHoursArr = [];
            for (let emp in todayWorkerHours) {
                dailyHoursArr.push(`${emp}(${todayWorkerHours[emp]}h)`);
            }
            let dailyHoursStr = dailyHoursArr.length > 0 ? dailyHoursArr.join(', ') : '-';

            monthlySchedule.push({
                date: d,
                dayName: dayNames[dayOfWeek],
                dayOfWeek: dayOfWeek,
                isOffDay: false,
                morning: assigned.morning.length > 0 ? assigned.morning.join(', ') : '-',
                noon: assigned.noon.length > 0 ? assigned.noon.join(', ') : '-',
                night: assigned.night.length > 0 ? assigned.night.join(', ') : '-',
                off: offEmps.length > 0 ? offEmps.join(', ') : '無休',
                dailyHoursStr: dailyHoursStr
            });
        }
    }

    renderMonthlyTable(monthVal, monthlySchedule, stats, employees);
}

function renderMonthlyTable(monthVal, schedule, stats, employees) {
    let html = `<div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px;">
        <h2>${monthVal} 月度班表總覽</h2>
        <div>
            <button class="btn-sec" onclick="toggleResultWeeks(true)">全展開當月</button>
            <button class="btn-sec" onclick="toggleResultWeeks(false)">全隱藏當月</button>
        </div>
    </div>`;

    let weeks = [];
    let currentWeek = [];

    schedule.forEach((dayData, index) => {
        if (dayData.dayOfWeek === 0 && currentWeek.length > 0) {
            weeks.push(currentWeek);
            currentWeek = [];
        }
        currentWeek.push(dayData);
        if (index === schedule.length - 1) {
            weeks.push(currentWeek);
        }
    });

    weeks.forEach((weekData, wIndex) => {
        let weekNum = wIndex + 1;
        let startDate = weekData[0].date;
        let endDate = weekData[weekData.length - 1].date;

        html += `<div class="week-card">
            <div class="week-header result-header">
                <span>第 ${weekNum} 週 (${monthVal.split('-')[1]}/${startDate} 日 ~ ${monthVal.split('-')[1]}/${endDate} 日)</span>
                <button class="btn-toggle-week" onclick="toggleBlock('result_week_${weekNum}', this)">隱藏當週</button>
            </div>
            <div class="table-wrapper" id="result_week_${weekNum}">
                <table class="result-table">
                    <tr>
                        <th style="width: 6%;">日期</th>
                        <th style="width: 6%;">星期</th>
                        <th style="width: 20%;">早班 (08:00-12:00 / 4h)</th>
                        <th style="width: 20%;">中班 (12:00-17:00 / 5h)</th>
                        <th style="width: 20%;">晚班 (17:00-21:00 / 4h)</th>
                        <th style="width: 12%;">全日排休人員</th>
                        <th style="width: 16%;">當日個人工作時數</th>
                    </tr>`;

        weekData.forEach(s => {
            if (s.isOffDay) {
                html += `<tr class="sunday">
                    <td>${s.date} 日</td>
                    <td>週${s.dayName}</td>
                    <td colspan="5">全店公休 / 無排班</td>
                </tr>`;
            } else {
                html += `<tr>
                    <td><strong>${s.date} 日</strong></td>
                    <td>週${s.dayName}</td>
                    <td>${s.morning}</td>
                    <td>${s.noon}</td>
                    <td>${s.night}</td>
                    <td class="off">${s.off}</td>
                    <td class="work-hours-cell">${s.dailyHoursStr}</td>
                </tr>`;
            }
        });

        html += `</table></div></div>`;
    });

    html += `<h3>【個人工時與休假統計】(上限 160 小時 / 平日上限 4 天休假)</h3>`;
    html += `<div class="summary-grid">`;
    
    employees.forEach(emp => {
        let h = stats[emp].hours;
        let isPassHours = h <= 160;
        let offDays = stats[emp].weekdayOffs;
        let isPassOff = offDays <= 4;
        
        html += `<div class="summary-card">
            <strong>${emp}</strong><br>
            總工時：<span class="${isPassHours ? 'pass' : 'warn'}">${h} 小時</span><br>
            總班次：${stats[emp].shiftsCount} 次<br>
            平日全休：<span class="${isPassOff ? 'pass' : 'warn'}">${offDays} 天</span>
        </div>`;
    });
    
    html += `</div>`;

    document.getElementById('result').innerHTML = html;
}

function toggleBlock(blockId, btn) {
    const block = document.getElementById(blockId);
    if (block.style.display === "none") {
        block.style.display = "block";
        btn.innerText = "隱藏當週";
    } else {
        block.style.display = "none";
        btn.innerText = "展開當週";
    }
}

function toggleInputWeeks(showAll) {
    const blocks = document.querySelectorAll('[id^="input_week_"]');
    blocks.forEach(b => {
        b.style.display = showAll ? "block" : "none";
        const btn = b.previousElementSibling.querySelector('button');
        if (btn) btn.innerText = showAll ? "隱藏當週" : "展開當週";
    });
}

function toggleResultWeeks(showAll) {
    const blocks = document.querySelectorAll('[id^="result_week_"]');
    blocks.forEach(b => {
        b.style.display = showAll ? "block" : "none";
        const btn = b.previousElementSibling.querySelector('button');
        if (btn) btn.innerText = showAll ? "隱藏當週" : "展開當週";
    });
}

window.onload = renderDailyInputTable;
</script>

</body>
</html>
