<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自訂人力配額與隨機排班系統</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1, h2, h3 { color: #333; }
        .control-panel {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            border: 1px solid #e9ecef;
        }
        .form-row {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .number-input {
            width: 70px;
            padding: 6px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        input[type="text"], input[type="month"] {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }
        button:hover { background-color: #0056b3; }
        .hint {
            font-size: 13px;
            color: #6c757d;
            margin-top: 5px;
        }
        .table-wrapper { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 14px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px 6px;
            text-align: center;
        }
        th { background-color: #e9ecef; position: sticky; top: 0; }
        .off { background-color: #ffe6e6; color: #d9534f; font-weight: bold; }
        .sunday { background-color: #f8d7da; color: #721c24; font-weight: bold; }
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }
        .summary-card {
            background: #e9ecef;
            padding: 10px 15px;
            border-radius: 6px;
            text-align: center;
        }
        .pass { color: #28a745; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>08:00 - 21:00 自訂人力配額隨機排班系統</h1>
    
    <div class="control-panel">
        <div class="form-row">
            <div class="form-group">
                <label for="monthPicker"><strong>選擇月份：</strong></label>
                <input type="month" id="monthPicker">
            </div>
            
            <div class="form-group" style="flex-grow: 1;">
                <label for="employeeInput"><strong>員工姓名（固定 6 位）：</strong></label>
                <input type="text" id="employeeInput" value="員工A, 員工B, 員工C, 員工D, 員工E, 員工F">
            </div>
        </div>

        <hr style="border: 0; border-top: 1px solid #dee2e6; margin: 15px 0;">

        <h3>平日 / 週六 每日人力需求設定（總和需剛好等於 6 人）：</h3>
        <div class="form-row">
            <div class="form-group">
                <label>早班 (08-12 / 4h)</label>
                <input type="number" id="morningCount" class="number-input" value="2" min="0" max="6">
            </div>
            <div class="form-group">
                <label>中班 (12-17 / 5h)</label>
                <input type="number" id="noonCount" class="number-input" value="2" min="0" max="6">
            </div>
            <div class="form-group">
                <label>晚班 (17-21 / 4h)</label>
                <input type="number" id="nightCount" class="number-input" value="1" min="0" max="6">
            </div>
            <div class="form-group">
                <label style="color:#d9534f; font-weight:bold;">排休人數</label>
                <input type="number" id="offCount" class="number-input" value="1" min="0" max="6">
            </div>
            
            <div class="form-group" style="margin-left: auto; align-self: flex-end;">
                <button onclick="generateMonthlySchedule()">隨機產生班表</button>
            </div>
        </div>
        <div class="hint">預設組合範例：早班 2 + 中班 2 + 晚班 1 + 排休 1 = 6 人（可自行修改）</div>
    </div>

    <div id="result"></div>
</div>

<script>
document.getElementById('monthPicker').value = new Date().toISOString().slice(0, 7);

function generateMonthlySchedule() {
    const monthVal = document.getElementById('monthPicker').value;
    if (!monthVal) { alert("請選擇月份！"); return; }

    const inputVal = document.getElementById('employeeInput').value;
    let employees = inputVal.split(/[,，\s]+/).filter(e => e.trim() !== '');

    if (employees.length !== 6) {
        alert("請輸入剛好 6 位員工姓名！");
        return;
    }

    // 取得自訂的人數設定
    const mCount = parseInt(document.getElementById('morningCount').value) || 0;
    const nCount = parseInt(document.getElementById('noonCount').value) || 0;
    const eCount = parseInt(document.getElementById('nightCount').value) || 0;
    const oCount = parseInt(document.getElementById('offCount').value) || 0;

    const totalInput = mCount + nCount + eCount + oCount;
    if (totalInput !== 6) {
        alert(`每日設定的人數總和必須剛好等於 6 人！\n目前設定：早(${mCount}) + 中(${nCount}) + 晚(${eCount}) + 休(${oCount}) = ${totalInput}人`);
        return;
    }

    const [year, month] = monthVal.split('-').map(Number);
    const totalDays = new Date(year, month, 0).getDate();
    const dayNames = ['日', '一', '二', '三', '四', '五', '六'];
    
    const shiftHours = { morning: 4, noon: 5, night: 4 };

    let stats = {};
    employees.forEach(emp => { 
        stats[emp] = { hours: 0, shiftsCount: 0, daysCount: 0, weekdayOffs: 0 }; 
    });

    let monthlySchedule = [];

    for (let d = 1; d <= totalDays; d++) {
        let dateObj = new Date(year, month - 1, d);
        let dayOfWeek = dateObj.getDay();
        let isSunday = dayOfWeek === 0;

        if (isSunday) {
            monthlySchedule.push({
                date: d, dayName: dayNames[dayOfWeek], isSunday: true,
                morning: '-', noon: '-', night: '-', off: employees.join(', ')
            });
        } else {
            // 隨機打亂當天的員工順序
            let shuffledEmployees = [...employees].sort(() => Math.random() - 0.5);

            // 優先考慮工時較少的人，進行微幅排序（平衡工時）
            shuffledEmployees.sort((a, b) => (stats[a].hours - stats[b].hours) + (Math.random() - 0.5));

            let assigned = { morning: [], noon: [], night: [], off: [] };

            // 依自訂人數分配
            assigned.morning = shuffledEmployees.splice(0, mCount);
            assigned.noon = shuffledEmployees.splice(0, nCount);
            assigned.night = shuffledEmployees.splice(0, eCount);
            assigned.off = shuffledEmployees; // 剩餘即為排休人員

            // 更新統計數據
            assigned.morning.forEach(emp => { stats[emp].hours += shiftHours.morning; stats[emp].shiftsCount++; stats[emp].daysCount++; });
            assigned.noon.forEach(emp => { stats[emp].hours += shiftHours.noon; stats[emp].shiftsCount++; stats[emp].daysCount++; });
            assigned.night.forEach(emp => { stats[emp].hours += shiftHours.night; stats[emp].shiftsCount++; stats[emp].daysCount++; });
            assigned.off.forEach(emp => { stats[emp].weekdayOffs++; });

            monthlySchedule.push({
                date: d,
                dayName: dayNames[dayOfWeek],
                isSunday: false,
                morning: assigned.morning.length > 0 ? assigned.morning.join(', ') : '-',
                noon: assigned.noon.length > 0 ? assigned.noon.join(', ') : '-',
                night: assigned.night.length > 0 ? assigned.night.join(', ') : '-',
                off: assigned.off.length > 0 ? assigned.off.join(', ') : '-'
            });
        }
    }

    renderMonthlyTable(monthVal, monthlySchedule, stats, employees, { mCount, nCount, eCount, oCount });
}

function renderMonthlyTable(monthVal, schedule, stats, employees, config) {
    let html = `<h2>${monthVal} 月度隨機班表總覽</h2>`;
    html += `<p style="color: #666;">（每日設定配置：早班 ${config.mCount}人 / 中班 ${config.nCount}人 / 晚班 ${config.eCount}人 / 排休 ${config.oCount}人）</p>`;

    html += `<div class="table-wrapper"><table>
        <tr>
            <th>日期</th>
            <th>星期</th>
            <th>早班 (08:00-12:00 / 4h)</th>
            <th>中班 (12:00-17:00 / 5h)</th>
            <th>晚班 (17:00-21:00 / 4h)</th>
            <th>當日排休人員 (${config.oCount}位)</th>
        </tr>`;

    schedule.forEach(s => {
        if (s.isSunday) {
            html += `<tr class="sunday">
                <td>${s.date} 日</td>
                <td>週${s.dayName}</td>
                <td colspan="4">全店公休 (例假日)</td>
            </tr>`;
        } else {
            html += `<tr>
                <td><strong>${s.date} 日</strong></td>
                <td>週${s.dayName}</td>
                <td>${s.morning}</td>
                <td>${s.noon}</td>
                <td>${s.night}</td>
                <td class="off">${s.off}</td>
            </tr>`;
        }
    });

    html += `</table></div>`;

    html += `<h3>【個人工時與休假統計】(目標：每人 160h 左右)</h3>`;
    html += `<div class="summary-grid">`;
    
    employees.forEach(emp => {
        let h = stats[emp].hours;
        html += `<div class="summary-card">
            <strong>${emp}</strong><br>
            總工時：<span class="pass">${h} 小時</span><br>
            出勤天數：${stats[emp].daysCount} 天<br>
            平日排休：${stats[emp].weekdayOffs} 天
        </div>`;
    });
    
    html += `</div>`;

    document.getElementById('result').innerHTML = html;
}

window.onload = generateMonthlySchedule;
</script>

</body>
</html>
