<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工程師英文輕鬆記憶卡</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f4f8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 480px;
            padding: 30px;
            text-align: center;
        }
        h1 {
            color: #1e293b;
            font-size: 1.5rem;
            margin-bottom: 8px;
        }
        p.subtitle {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 24px;
        }
        .card {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border-radius: 12px;
            padding: 30px 20px;
            margin-bottom: 20px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            transition: transform 0.2s;
        }
        .word {
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .phonetic {
            font-size: 1.1rem;
            color: #93c5fd;
            margin-bottom: 12px;
        }
        .meaning {
            font-size: 1.4rem;
            color: #fef08a;
            font-weight: 600;
            margin-top: 10px;
            display: none;
        }
        .context {
            font-size: 0.95rem;
            color: #e0e7ff;
            margin-top: 8px;
            font-style: italic;
            display: none;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        button {
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-sound {
            background-color: #e2e8f0;
            color: #334155;
        }
        .btn-sound:hover { background-color: #cbd5e1; }
        
        .btn-show {
            background-color: #f59e0b;
            color: white;
        }
        .btn-show:hover { background-color: #d97706; }

        .btn-next {
            background-color: #10b981;
            color: white;
            width: 100%;
            margin-top: 10px;
        }
        .btn-next:hover { background-color: #059669; }

        .progress {
            margin-top: 20px;
            color: #94a3b8;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>工程師英文輕鬆卡</h1>
    <p class="subtitle">看字、聽音、聯想畫面｜不必背字母！</p>

    <div class="card" id="card">
        <div class="word" id="word">Assembly</div>
        <div class="phonetic" id="phonetic">/ 阿-森-布里 /</div>
        <div class="meaning" id="meaning">組裝 / 裝配</div>
        <div class="context" id="context">💡 實用片語：Assembly process (組裝流程)</div>
    </div>

    <div class="btn-group">
        <button class="btn-sound" onclick="speakWord()">🔊 發音</button>
        <button class="btn-show" onclick="toggleAnswer()">👁️ 看答案/畫面</button>
    </div>
    
    <button class="btn-next" onclick="nextWord()">下一字 ➔</button>

    <div class="progress" id="progress">卡片：1 / 8</div>
</div>

<script>
    // 專為機械 / 工程設計領域整理的核心單字庫
    const vocabList = [
        { word: "Assembly", phonetic: "Ah-sem-bly (阿-森-布里)", meaning: "組裝 / 裝配", context: "💡 畫面：把零件一個個組裝成結構\n例句：Assembly process" },
        { word: "Tolerance", phonetic: "Toe-ler-ance (透-勒-倫斯)", meaning: "公差 / 容許值", context: "💡 畫面：CAD圖面上標註的加減公差範圍\n例句：Tight tolerance (精密公差)" },
        { word: "Dimension", phonetic: "Di-men-sion (迪-門-宣)", meaning: "尺寸 / 維度", context: "💡 畫面：標註長寬高數值的箭頭線\n例句：Check dimension (檢查尺寸)" },
        { word: "Specification", phonetic: "Spe-ci-fi-ca-tion (斯背-西-費-ケイ-宣)", meaning: "規格 / 規範", context: "💡 畫面：機台與零件的詳細技術規格書\n例句：Technical spec" },
        { word: "Troubleshooting", phonetic: "Trou-ble-shoot-ing (創-波-休-聽)", meaning: "故障排除 / 除錯", context: "💡 畫面：拿著工具尋找並修復設備問題\n例句：Equipment troubleshooting" },
        { word: "Calibration", phonetic: "Ca-li-bra-tion (卡-利-布銳-宣)", meaning: "校正 / 調校", context: "💡 畫面：使用標準件對機台進行精度校正\n例句：Sensor calibration" },
        { word: "Component", phonetic: "Com-po-nent (康-玻-嫩特)", meaning: "零件 / 組件", context: "💡 畫面：桌上擺放的機械零件\n例句：Electronic component" },
        { word: "Mechanism", phonetic: "Me-cha-nism (麥-卡-尼-森)", meaning: "機構 / 機械裝置", context: "💡 畫面：齒輪與連桿運轉的機械結構\n例句：Linkage mechanism" }
    ];

    let currentIndex = 0;
    let isShowingAnswer = false;

    function updateCard() {
        const item = vocabList[currentIndex];
        document.getElementById('word').innerText = item.word;
        document.getElementById('phonetic').innerText = item.phonetic;
        document.getElementById('meaning').innerText = item.meaning;
        document.getElementById('context').innerText = item.context;
        
        // 隱藏答案
        document.getElementById('meaning').style.display = 'none';
        document.getElementById('context').style.display = 'none';
        isShowingAnswer = false;

        document.getElementById('progress').innerText = `卡片：${currentIndex + 1} / ${vocabList.length}`;
    }

    function toggleAnswer() {
        const meaning = document.getElementById('meaning');
        const context = document.getElementById('context');
        if (!isShowingAnswer) {
            meaning.style.display = 'block';
            context.style.display = 'block';
            isShowingAnswer = true;
        } else {
            meaning.style.display = 'none';
            context.style.display = 'none';
            isShowingAnswer = false;
        }
    }

    function nextWord() {
        currentIndex = (currentIndex + 1) % vocabList.length;
        updateCard();
    }

    function speakWord() {
        const word = vocabList[currentIndex].word;
        const utterance = new SpeechSynthesisUtterance(word);
        utterance.lang = 'en-US';
        speechSynthesis.speak(utterance);
    }

    // 初始化第一張卡片
    updateCard();
</script>

</body>
</html>
